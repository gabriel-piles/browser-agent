<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>SPA Dynamic</title></head>
<body>
<div class="container">
<h1>SPA Document Archive</h1>
<div class="item-list" id="app"></div>
</div>
<script>
const items = [
  {id: 1, title: "SPA Document 1", date: "2024-03-01"},
  {id: 2, title: "SPA Document 2", date: "2024-02-15"},
  {id: 3, title: "SPA Document 3", date: "2024-01-20"},
  {id: 4, title: "SPA Document 4", date: "2023-12-10"},
  {id: 5, title: "SPA Document 5", date: "2023-11-05"},
  {id: 6, title: "SPA Document 6", date: "2023-10-18"},
  {id: 7, title: "SPA Document 7", date: "2023-09-22"},
  {id: 8, title: "SPA Document 8", date: "2023-08-14"},
  {id: 9, title: "SPA Document 9", date: "2023-07-30"},
  {id: 10, title: "SPA Document 10", date: "2023-06-12"}
];
setTimeout(function() {
  var app = document.getElementById("app");
  items.forEach(function(item) {
    var div = document.createElement("div");
    div.className = "item";
    div.innerHTML = '<h3><a href="/doc/' + item.id + '?scenario=spa_dynamic">' + item.title + '</a></h3>'
                  + '<span class="date">' + item.date + '</span>';
    app.appendChild(div);
  });
}, 1500);
</script>
</body>
</html>
